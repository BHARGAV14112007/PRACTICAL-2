<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<body>

    <h1>Contact Us</h1>

    <p>
        If you have any questions or feedback, feel free to reach out to us!
    </p>

    <!-- Navigation -->
    <header>
        <nav>
            <button
                style="margin-right: 10px; padding: 10px 20px; border: none;"
                onclick="window.location.href='../home.html'">
                Back to Home
            </button>
        </nav>
    </header>

    <br><br>

    <!-- Contact Section -->
    <main>

        <table align="center" cellpadding="20">

            <tr>

                <!-- Contact Form -->
                <td>
                    <fieldset style="width:400px;">

                        <legend>Contact Form</legend>

                        <form>

                            <label>Name</label><br>
                            <input type="text" placeholder="Enter Your Name" size="60"><br><br>

                            <label>Email</label><br>
                            <input type="email" placeholder="Enter Your Email" size="60"><br><br>

                            <label>Subject</label><br>
                            <input type="text" placeholder="Enter Subject" size="60"><br><br>

                            <label>Message</label><br>
                            <textarea rows="6" cols="60" placeholder="Enter Your Message"></textarea><br><br>

                            <center>
                                <button type="submit"
                                    style="padding:10px 30px; border:none;">
                                    Send
                                </button>
                            </center>

                        </form>

                    </fieldset>
                </td>

                <!-- Contact Information -->
                <td>
                    <fieldset style="width:450px; height:420px;">

                        <legend>Contact Information</legend>

                        <h2>Contact Information</h2>

                        <p><strong>Address:</strong><br> ABC University, Gujarat, India</p>

                        <p><strong>Phone:</strong><br> +91 9876543210</p>

                        <p><strong>Email:</strong><br> studenthub@gmail.com</p>

                        <p><strong>Office Hours:</strong><br> Monday - Friday<br>9:00 AM - 5:00 PM</p>

                    </fieldset>
                </td>

            </tr>

        </table>

    </main>

</body>
</html>
