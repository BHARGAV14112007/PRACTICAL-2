<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
</head>

<body>

    <h1>Admin Panel</h1>

    <!-- Navigation -->
    <header>
        <nav>
            <button
                style=" margin-right: 10px; padding: 10px 20px; border: none;"
                onclick="window.location.href='../home.html'">
                Back to Home
            </button>
        </nav>
    </header>

    <br><br>

    <table align="center" cellpadding="15">

        <tr>

            <!-- Sidebar -->
            <td valign="top">
                <fieldset>
                    <button>Dashboard</button><br><br>
                    <button>Students</button><br><br>
                    <button>Events</button><br><br>
                    <button>Notices</button><br><br>
                    <button>Resources</button><br><br>
                    <button>Settings</button><br><br>
                    <button>Logout</button>
                </fieldset>
            </td>

            <!-- Main Content -->
            <td>

                <button>Total Students</button>
                <button>Events</button>
                <button>Notices</button>
                <button>Materials</button>

                <br><br>

                <table cellpadding="10">
                    <tr>
                        <td>
                            <fieldset style="width:350px; height:250px;">
                                <legend>Manage Students</legend>
                                <h2>Manage Students</h2>
                            </fieldset>
                        </td>

                        <td>
                            <fieldset style="width:300px; height:250px;">
                                <legend>Recent Activity</legend>
                                <h2>Recent Activity</h2>
                            </fieldset>
                        </td>
                    </tr>
                </table>

            </td>

        </tr>

    </table>

</body>
</html>
