<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
</head>

<body>

    <h1>Register Page</h1>

    <p>
        Create an account to get started!
    </p>

    <!-- Navigation -->
    <header>
        <nav>
            <button
                style="margin-right: 10px; padding: 10px 20px; border: none;"
                onclick="window.location.href='../home.html'">
                Back to Home
            </button>
        </nav>
    </header>

    <br><br>

    <!-- Register Form -->
    <main>

        <fieldset style="width: 700px; margin: auto;">

            <legend>Registration Form</legend>

            <form>

                <label>Full Name</label><br>
                <input type="text" placeholder="Enter Full Name" size="80"><br><br>

                <label>Email</label><br>
                <input type="email" placeholder="Enter Email" size="80"><br><br>

                <label>University / College</label><br>
                <input type="text" placeholder="Enter University / College" size="80"><br><br>

                <label>Course / Branch</label><br>
                <input type="text" placeholder="Enter Course / Branch" size="80"><br><br>

                <label>Password</label><br>
                <input type="password" placeholder="Enter Password" size="80"><br><br>

                <label>Confirm Password</label><br>
                <input type="password" placeholder="Confirm Password" size="80"><br><br>

                <center>
                    <button type="submit"
                        style="padding: 10px 30px;">
                        Register
                    </button>
                </center>

            </form>

        </fieldset>

    </main>

</body>
</html>
