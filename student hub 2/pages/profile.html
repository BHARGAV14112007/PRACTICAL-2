<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
</head>

<body">

    <h1>Profile</h1>

    <p>
        This is your profile page.
    </p>

    <!-- Navigation -->
    <header>
        <nav>
            <button
                style="margin-right: 10px; padding: 10px 20px; border: none;"
                onclick="window.location.href='../home.html'">
                Back to Home
            </button>
        </nav>
    </header>

    <br><br>

    <table align="center" cellpadding="15">

        <tr>

            <!-- Sidebar -->
            <td valign="top">

                <fieldset>

                    <p><button>Dashboard</button></p>
                    <p><button>Profile</button></p>
                    <p><button>Events</button></p>
                    <p><button>Resources</button></p>
                    <p><button>Settings</button></p>
                    <p><button>Logout</button></p>

                </fieldset>

            </td>

            <!-- Profile -->
            <td>

                <table cellpadding="15">

                    <tr>

                        <td valign="top">

                            <fieldset>
                                <legend>Profile Photo</legend>

                                <img src="profile.jpg" width="150" height="150" alt="Profile Photo">

                            </fieldset>

                        </td>

                        <td>

                            <fieldset>

                                <p>Name :
                                    <input type="text">
                                </p>

                                <p>Email :
                                    <input type="email">
                                </p>

                                <p>Enrollment No :
                                    <input type="text">
                                </p>

                                <p>Course :
                                    <input type="text">
                                </p>

                                <p>Phone :
                                    <input type="text">
                                </p>

                            </fieldset>

                            <br>

                            <button
                                style="padding:10px 25px; border:none;">
                                Edit Profile
                            </button>

                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>
</html>
