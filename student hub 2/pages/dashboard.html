<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>

    <h1>Dashboard</h1>

    <p>
        Welcome to your Dashboard!
    </p>

    <!-- Navigation -->
    <header>
        <nav>
            <button
                style="margin-right: 10px; padding: 10px 20px; border: none;"
                onclick="window.location.href='../home.html'">
                Back to Home
            </button>
        </nav>
    </header>

    <br><br>

    <table align="center" cellpadding="15">

        <tr>

            <!-- Sidebar -->
            <td valign="top">
                <fieldset>

                    <p><button onclick="window.location.href='dashboard.html'">Dashboard</button></p>

                    <p><button onclick="window.location.href='pages/profile.html'">Profile</button></p>

                    <p><button onclick="window.location.href='pages/event.html'">Events</button></p>

                    <p><button onclick="window.location.href='pages/resource.html'">Resources</button></p>

                    <p><button onclick="window.location.href='pages/faq.html'">FAQ</button></p>

                    <p><button>Logout</button></p>

                </fieldset>
            </td>

            <!-- Main Content -->
            <td>

                <h2>Welcome, Student!</h2>

                <button>Notices</button>
                <button>Events</button>
                <button>Resources</button>
                <button>Attendance</button>

                <br><br>

                <table cellpadding="10">

                    <tr>

                        <td>
                            <fieldset style="width:350px; height:250px;">
                                <legend>Recent Notices</legend>

                                <p>Notice 1</p>
                                <p>Notice 2</p>
                                <p>Notice 3</p>

                            </fieldset>
                        </td>

                        <td>
                            <fieldset style="width:350px; height:250px;">
                                <legend>Upcoming Events</legend>

                                <p>Event 1</p>
                                <p>Event 2</p>
                                <p>Event 3</p>

                            </fieldset>
                        </td>

                    </tr>

                </table>

            </td>

        </tr>

    </table>

</body>
</html>
